<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Sherlock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Sherlock Read-Along</title>
<style>
:root{--bg:#121214;--bar:#1d1d22;--line:#2c2c33;--fg:#f4f1ea;--dim:#a9a69f;--gold:#e8c46a;--hi:#ffd84d;--hifg:#111;--btn:#2a2a31;--ok:#7fd18b;
 --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--fs:23px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:var(--fg);background:var(--btn);border:0;border-radius:10px;min-height:44px;min-width:44px;padding:0 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:active{background:var(--btn);opacity:.85}
button.gold{background:var(--gold);color:#1a1405;font-weight:700}
.bar{background:var(--bar);flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line)}
header.bar{padding-top:var(--sat);min-height:calc(52px + var(--sat))}
header h1{font:600 18px/1.2 Georgia,"Times New Roman",serif;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
header h1 small{color:var(--dim);font:13px -apple-system,sans-serif;margin-left:6px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hidden{display:none!important}
/* library */
#lib{padding:14px 14px calc(20px + var(--sab))}
.help{background:#1b1b20;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.help p{margin:0;flex:1;min-width:240px;color:var(--fg);line-height:1.45}
.help b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:#1a1a1f;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.card .cv{display:block;width:100%;aspect-ratio:2/3;border:0;padding:0;border-radius:0;background:#000}
.card .cv svg{display:block;width:100%;height:100%}
.card .meta{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .t{font:600 15px/1.25 Georgia,serif}
.card .s{font-size:12.5px;color:var(--dim)}
.card .prog{height:4px;background:#33333b;border-radius:2px;overflow:hidden}
.card .prog i{display:block;height:100%;background:var(--gold)}
.card .act{margin-top:auto;display:flex;gap:6px}
.card .act button{flex:1;font-size:14px;min-height:40px;padding:0 8px}
.ok{color:var(--ok)}
.foot{color:var(--dim);font-size:12.5px;margin:22px 2px 0;line-height:1.5}
/* reader */
#text{padding:18px max(18px,calc((100% - 760px)/2)) 45vh;font:var(--fs)/1.62 Georgia,"Times New Roman",serif;color:var(--fg)}
#text h2{font:600 1.25em/1.25 Georgia,serif;color:var(--gold);margin:6px 0 2px}
#text .sub{color:var(--dim);font:14px -apple-system,sans-serif;margin-bottom:22px}
#text p{margin:0 0 .85em;text-indent:1.2em}
#text span{border-radius:4px;padding:0 1px;margin:0 -1px;cursor:pointer}
#text span.on{background:var(--hi);color:var(--hifg);box-shadow:0 0 0 2px var(--hi)}
#text.nosync span{cursor:default}
#player{flex:none;background:var(--bar);border-top:1px solid var(--line);padding:6px 12px calc(8px + var(--sab))}
.seek{display:flex;align-items:center;gap:10px;font:13px ui-monospace,Menlo,monospace;color:var(--dim)}
.seek input{flex:1;accent-color:var(--gold);height:40px}
.ctl{display:flex;justify-content:center;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.ctl button{min-width:56px;font-size:15px;font-weight:600;white-space:nowrap}
@media (max-width:500px){.ctl{gap:6px}.ctl button{flex:1;min-width:0;padding:0 6px}.ctl #play{flex:0 0 68px}}
.ctl #play{min-width:72px;min-height:56px;border-radius:28px;background:var(--gold);color:#1a1405;font-size:24px}
#follow{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + var(--sab));background:var(--gold);color:#1a1405;font-weight:700;border-radius:22px;box-shadow:0 4px 16px #0008;z-index:5}
#noaudio{flex:none;background:var(--bar);border-top:1px solid var(--line);padding:12px 14px calc(12px + var(--sab));display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
#noaudio span{color:var(--dim)}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bar);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + var(--sab));width:min(520px,100%);display:flex;flex-direction:column;gap:8px}
.sheet h3{margin:2px 4px 6px;font:600 17px Georgia,serif}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row button{flex:1 1 30%}
.sheet button.sel{outline:2px solid var(--gold)}
#toast{position:fixed;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);background:#2b2b33;border:1px solid #444;color:var(--fg);padding:12px 16px;border-radius:12px;z-index:30;max-width:min(92vw,560px);font-size:15px;line-height:1.45;box-shadow:0 6px 24px #000a}
#busy{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:center;justify-content:center;font-size:17px}
</style>
</head>
<body>
<header class="bar" id="hdr"></header>
<main id="main"></main>
<div id="foot"></div>
<input type="file" id="file" accept="audio/*,.m4a,.mp3,.aac,.m4b" multiple class="hidden">
<script>
"use strict";
const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,"0");return h?`${h}:${String(m).padStart(2,"0")}:${x}`:`${m}:${x}`};
let LIB=[], HAVE={}, cur=null, audio=new Audio(), follow=true, sleepAt=0, sleepEnd=false, pendingFor=null;
audio.preload="auto";
// ---------- IndexedDB ----------
const DB=new Promise((ok,no)=>{const r=indexedDB.open("sherlock",1);r.onupgradeneeded=()=>r.result.createObjectStore("audio");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idb=(mode,fn)=>DB.then(db=>new Promise((ok,no)=>{const tx=db.transaction("audio",mode),st=tx.objectStore("audio");const r=fn(st);tx.oncomplete=()=>ok(r&&r.result);tx.onerror=()=>no(tx.error)}));
const getAudio=id=>idb("readonly",s=>s.get(id));
const putAudio=(id,v)=>idb("readwrite",s=>s.put(v,id));
const delAudio=id=>idb("readwrite",s=>s.delete(id));
const listAudio=()=>idb("readonly",s=>s.getAllKeys());
// ---------- covers ----------
const PAL={"dancing-men":["#3b1f1f","#8c2f2f"],"norwood-builder":["#2a1f14","#a0522d"],"three-students":["#1d2433","#3e5a8a"],"black-peter":["#101a22","#2e4e5e"],"charles-augustus-milverton":["#231a2e","#5e3a7a"],"golden-pince-nez":["#2b2410","#a8862c"],"missing-three-quarter":["#14261c","#2f6b45"],"second-stain":["#2a1414","#7a2230"],"illustrious-client":["#1e1a12","#6d5a2c"],"blanched-soldier":["#1f2326","#7d8a90"],"sussex-vampire":["#1a0f14","#6e1630"],"three-garridebs":["#1c2214","#566b2c"],"creeping-man":["#15151c","#44445e"],"lions-mane":["#0f1f26","#1f6c80"],"veiled-lodger":["#1d1418","#5c3b4a"]};
function motif(id){
 const g='stroke="#e8c46a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"';
 if(id==="dancing-men")return [30,85,140].map((x,i)=>`<g transform="translate(${x+15},150)" ${g}><circle cx="0" cy="0" r="9"/><path d="M0 9v34M0 20l${i%2?-18:16} ${i?-12:10}M0 20l${i%2?16:-16} -10M0 43l-14 24M0 43l${i==1?18:12} 22"/></g>`).join("");
 if(id==="golden-pince-nez")return `<g ${g}><circle cx="78" cy="180" r="28"/><circle cx="142" cy="180" r="28"/><path d="M106 176q4-12 8 0M50 172l-22-30"/></g>`;
 if(id==="lions-mane")return `<g ${g}><path d="M60 175q50-60 100 0z"/>${[70,85,100,115,130,145].map(x=>`<path d="M${x} 177q-8 20 0 40t0 40"/>`).join("")}</g>`;
 if(id==="second-stain")return `<g ${g}><rect x="62" y="140" width="96" height="120" rx="4"/><path d="M76 166h68M76 186h68M76 206h40"/></g><circle cx="132" cy="230" r="14" fill="#e8c46a"/>`;
 if(id==="veiled-lodger")return `<g ${g}><path d="M110 130q-42 0-42 60v60h84v-60q0-60-42-60z"/><path d="M78 190h64"/></g>`;
 if(id==="black-peter")return `<g ${g}><path d="M110 130v120M80 160h60M110 250q-40 0-46-30M110 250q40 0 46-30"/></g>`;
 return `<g ${g}><circle cx="98" cy="180" r="34"/><path d="M122 205l36 40"/></g>`;
}
function cover(s,i){const [a,b]=PAL[s.id]||["#222","#555"];const words=s.title.replace(/^The /,"").split(" ");const lines=[];let l="";for(const w of words){if((l+" "+w).trim().length>13){lines.push(l);l=w}else l=(l+" "+w).trim()}lines.push(l);
 return `<svg viewBox="0 0 220 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(s.title)}"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs><rect width="220" height="330" fill="url(#g${i})"/><rect x="10" y="10" width="200" height="310" fill="none" stroke="#e8c46a" stroke-opacity=".7" stroke-width="1.5"/><rect x="15" y="15" width="190" height="300" fill="none" stroke="#e8c46a" stroke-opacity=".35"/>
 <text x="110" y="44" text-anchor="middle" fill="#e8c46a" font-family="Georgia,serif" font-size="11" letter-spacing="3">SHERLOCK HOLMES</text>${(s.title.startsWith("The ")?`<text x="110" y="72" text-anchor="middle" fill="#f4f1ea" font-family="Georgia,serif" font-style="italic" font-size="15">The</text>`:"")}
 ${lines.map((t,k)=>`<text x="110" y="${(s.title.startsWith("The ")?98:84)+k*27}" text-anchor="middle" fill="#f4f1ea" font-family="Georgia,serif" font-weight="bold" font-size="23">${esc(t)}</text>`).join("")}
 <g transform="translate(0,${lines.length>1?20:0})">${motif(s.id)}</g><text x="110" y="300" text-anchor="middle" fill="#e8c46a" fill-opacity=".85" font-family="Georgia,serif" font-size="10.5" letter-spacing="1">${s.year} · CONAN DOYLE</text></svg>`}
// ---------- helpers ----------
const pos=id=>+localStorage.getItem("pos:"+id)||0;
function toast(html,ms=4500){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.append(t)}t.innerHTML=html;t.classList.remove("hidden");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add("hidden"),ms)}
function busy(on,msg){let b=$("#busy");if(on){if(!b){b=document.createElement("div");b.id="busy";document.body.append(b)}b.textContent=msg;b.classList.remove("hidden")}else b&&b.classList.add("hidden")}
const key=s=>s.toLowerCase().replace(/^the /,"").replace(/[^a-z]/g,"").replace(/^the/,"");
function fileDuration(f){return new Promise(ok=>{const a=new Audio(),u=URL.createObjectURL(f);let d=false;const fin=v=>{if(d)return;d=true;URL.revokeObjectURL(u);ok(v)};a.preload="metadata";a.onloadedmetadata=()=>fin(a.duration);a.onerror=()=>fin(0);setTimeout(()=>fin(0),8000);a.src=u})}
async function addFiles(files){
 files=[...files];if(!files.length)return;const done=[],miss=[],warn=[];
 for(const [n,f] of files.entries()){
  busy(true,`Saving ${n+1} of ${files.length}: ${f.name}`);
  let s=null;
  if(pendingFor&&files.length===1)s=LIB.find(x=>x.id===pendingFor);
  if(!s){const k=key(f.name.replace(/\.[^.]+$/,""));s=LIB.find(x=>k.includes(key(x.title)))||LIB.find(x=>key(x.title).includes(k)&&k.length>5)}
  const d=await fileDuration(f);
  if(!s&&d)s=LIB.reduce((b,x)=>Math.abs(x.duration-d)<Math.abs((b?b.duration:1e9)-d)?x:b,null),s=s&&Math.abs(s.duration-d)<4?s:null;
  if(!s){miss.push(f.name);continue}
  if(d&&Math.abs(s.duration-d)>4)warn.push(`${esc(s.title)} (file is ${fmt(d)}, synced recording is ${fmt(s.duration)})`);
  try{await putAudio(s.id,{blob:f,name:f.name,type:f.type,size:f.size})}catch(e){try{await putAudio(s.id,{buf:await f.arrayBuffer(),name:f.name,type:f.type||"audio/mp4",size:f.size})}catch(e2){busy(false);toast("Couldn't save "+esc(f.name)+": "+esc(String(e2.message||e2)),9000);continue}}
  done.push(s.title);
 }
 pendingFor=null;busy(false);await refreshHave();
 let msg="";if(done.length)msg+=`<b class="ok">Added ${done.length}:</b> ${done.map(esc).join(", ")}`;
 if(miss.length)msg+=`<br><b>Couldn't tell which story:</b> ${miss.map(esc).join(", ")}. Use that story's own <b>Add audio</b> button.`;
 if(warn.length)msg+=`<br><b>Length doesn't match, the highlight may drift:</b> ${warn.join("; ")}`;
 toast(msg||"Nothing added",9000);
 if(cur&&HAVE[cur.id])openStory(cur.id,true);else if(!cur)renderLib();
}
async function refreshHave(){HAVE={};for(const k of await listAudio())HAVE[k]=1}
$("#file").addEventListener("change",e=>{const f=e.target.files;addFiles(f).finally(()=>e.target.value="")});
function pick(forId){pendingFor=forId||null;$("#file").multiple=!forId;$("#file").click()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
// ---------- library ----------
function renderLib(){
 cur=null;document.title="Sherlock Read-Along";
 $("#hdr").innerHTML=`<h1>Sherlock Holmes <small>Read-Along</small></h1><button class="gold" id="addall">＋ Add audio files</button>`;
 $("#addall").onclick=()=>pick();
 const n=Object.keys(HAVE).length;
 $("#main").innerHTML=`<div id="lib">${n<LIB.length?`<div class="help"><p><b>Add your audiobooks once.</b> Tap <b>＋ Add audio files</b>, choose <b>Browse</b>, open the folder with your Sherlock Holmes files, tap <b>Select</b>, pick them all, then tap <b>Open</b>. Each file is matched to its story by name and saved on this ${/iPad/.test(navigator.userAgent)||innerWidth>700?"iPad":"device"}. ${n?`${n} of ${LIB.length} added.`:""}</p><button class="gold" id="addall2">＋ Add audio files</button></div>`:""}
 <div class="grid">${LIB.map((s,i)=>{const p=pos(s.id),pc=Math.min(100,100*p/s.duration);return `<div class="card"><button class="cv" data-open="${s.id}" aria-label="Open ${esc(s.title)}">${cover(s,i)}</button><div class="meta"><div class="t">${esc(s.title)}</div><div class="s">${esc(s.book.replace("Sherlock Holmes","S.H."))} · ${fmt(s.duration)}</div>${p>5?`<div class="prog"><i style="width:${pc}%"></i></div>`:""}
 <div class="act">${HAVE[s.id]?`<button class="gold" data-open="${s.id}">${p>5?"▶ Resume "+fmt(p):"▶ Play"}</button>`:`<button data-open="${s.id}">Read</button><button class="gold" data-add="${s.id}">＋ Audio</button>`}</div></div></div>`}).join("")}</div>
 <p class="foot">Text: Project Gutenberg (public domain in the US). Your audio stays on this device and is never uploaded. Five Orange Pips isn't here because its file is copy-protected and can't be synced.</p></div>`;
 const a2=$("#addall2");if(a2)a2.onclick=()=>pick();
 $("#main").onclick=e=>{const o=e.target.closest("[data-open]"),a=e.target.closest("[data-add]");if(a)pick(a.dataset.add);else if(o)openStory(o.dataset.open)};
 $("#foot").innerHTML="";
}
// ---------- reader ----------
let T=[],spans=[],on=-1,url=null,saveTick=0;
async function openStory(id,keepPos){
 const s=LIB.find(x=>x.id===id);if(!s)return renderLib();
 if(cur&&cur.id!==id){audio.pause()}
 const d=await (await fetch(`data/${id}.json`)).json();
 cur={...s,...d};T=d.t;document.title=s.title;
 $("#hdr").innerHTML=`<button id="back" aria-label="Library">‹ Library</button><h1>${esc(s.title)}</h1><button id="aa" aria-label="Text size">Aa</button>`;
 $("#back").onclick=()=>{save();audio.pause();history.replaceState(null,"","#");renderLib()};
 $("#aa").onclick=textSheet;
 let w=0;$("#main").innerHTML=`<div id="text"><h2>${esc(s.title)}</h2><div class="sub">${esc(s.book)} · ${s.year} · Arthur Conan Doyle</div>${d.paras.map(p=>"<p>"+p.split(/\s+|(?<=—)(?=\S)/).filter(Boolean).map(x=>`<span>${esc(x)}</span>`+(x.endsWith("—")?"":" ")).join("")+"</p>").join("")}</div>`;
 spans=[...document.querySelectorAll("#text span")];on=-1;
 history.replaceState(null,"","#"+id);
 const rec=HAVE[id]?await getAudio(id):null;
 if(rec){
  if(url)URL.revokeObjectURL(url);
  const blob=rec.blob||new Blob([rec.buf],{type:rec.type});url=URL.createObjectURL(blob);
  if(audio.src!==url){audio.src=url}
  const p=pos(id);audio.currentTime=0;
  const setP=()=>{audio.currentTime=p;mark(true)};if(audio.readyState>=1)setP();else audio.addEventListener("loadedmetadata",setP,{once:true});
  renderPlayer();mediaSession();
 }else{
  $("#text").classList.add("nosync");
  $("#foot").innerHTML=`<div id="noaudio"><span>No audio on this device for this story yet.</span><button class="gold" id="add1">＋ Add audio for this story</button></div>`;$("#add1").onclick=()=>pick(id);
 }
 $("#main").scrollTop=0;follow=true;
 const sc=$("#main");const stop=()=>{if(!audio.paused||on>=0){follow=false;showFollow()}};
 sc.ontouchmove=stop;sc.onwheel=stop;
 $("#text").onclick=e=>{const sp=e.target.closest("span");if(!sp||!HAVE[id])return;const i=spans.indexOf(sp);audio.currentTime=T[i]/100+0.01;follow=true;showFollow();mark(true);audio.play().catch(()=>{})};
 if(keepPos)mark(true);
}
function textSheet(){const sizes=[18,20,23,26,30,34];const curS=+(localStorage.getItem("fs")||23);sheet(`<h3>Text size</h3><div class="row">${sizes.map(x=>`<button data-fs="${x}" class="${x===curS?"sel":""}" style="font-family:Georgia;font-size:${Math.round(x*.75)}px">Aa</button>`).join("")}</div>`,e=>{const b=e.target.closest("[data-fs]");if(b){localStorage.setItem("fs",b.dataset.fs);document.documentElement.style.setProperty("--fs",b.dataset.fs+"px");mark(true);return true}})}
function sheet(html,onclick){const s=document.createElement("div");s.className="sheet";s.innerHTML=`<div class="box">${html}<button id="sclose">Done</button></div>`;document.body.append(s);s.onclick=e=>{if(e.target===s||e.target.id==="sclose"||onclick(e))s.remove()}}
function renderPlayer(){
 $("#foot").innerHTML=`<button id="follow" class="hidden">↓ Back to the reading</button><div id="player"><div class="seek"><span id="tc">0:00</span><input id="sk" type="range" min="0" max="${Math.round(cur.duration)}" step="1" value="0" aria-label="Position"><span id="tr">${fmt(cur.duration)}</span></div>
 <div class="ctl"><button id="spd" aria-label="Speed">${audio.playbackRate}×</button><button id="b15" aria-label="Back 15 seconds">↺ 15</button><button id="play" aria-label="Play">▶</button><button id="f15" aria-label="Forward 15 seconds">15 ↻</button><button id="slp" aria-label="Sleep timer">☾ Sleep</button></div></div>`;
 $("#play").onclick=()=>audio.paused?audio.play().catch(()=>{}):audio.pause();
 $("#b15").onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime-15);follow=true;mark(true)};
 $("#f15").onclick=()=>{audio.currentTime=Math.min(cur.duration,audio.currentTime+15);follow=true;mark(true)};
 $("#spd").onclick=()=>{const R=[0.75,0.9,1,1.1,1.25,1.5,1.75,2];sheet(`<h3>Speed</h3><div class="row">${R.map(r=>`<button data-r="${r}" class="${r===audio.playbackRate?"sel":""}">${r}×</button>`).join("")}</div>`,e=>{const b=e.target.closest("[data-r]");if(b){audio.playbackRate=+b.dataset.r;localStorage.setItem("rate",b.dataset.r);$("#spd").textContent=b.dataset.r+"×";return true}})};
 $("#slp").onclick=()=>sheet(`<h3>Sleep timer</h3><div class="row">${[["Off",0],["5 min",5],["15 min",15],["30 min",30],["45 min",45],["60 min",60],["End of story",-1]].map(([l,m])=>`<button data-m="${m}">${l}</button>`).join("")}</div>`,e=>{const b=e.target.closest("[data-m]");if(!b)return;const m=+b.dataset.m;sleepEnd=m===-1;sleepAt=m>0?Date.now()+m*60000:0;slpLabel();return true});
 const sk=$("#sk");sk.oninput=()=>{$("#tc").textContent=fmt(sk.value)};sk.onchange=()=>{audio.currentTime=+sk.value;follow=true;mark(true)};
 $("#follow").onclick=()=>{follow=true;showFollow();mark(true)};
 slpLabel();playBtn();
}
function slpLabel(){const b=$("#slp");if(!b)return;b.textContent=sleepAt?`☾ ${Math.max(1,Math.ceil((sleepAt-Date.now())/60000))}m`:sleepEnd?"☾ End":"☾ Sleep";b.style.color=sleepAt||sleepEnd?"var(--gold)":""}
function showFollow(){const f=$("#follow");if(f)f.classList.toggle("hidden",follow)}
function playBtn(){const b=$("#play");if(b){b.textContent=audio.paused?"▶":"❚❚";b.setAttribute("aria-label",audio.paused?"Play":"Pause")}}
function idxAt(t){let lo=0,hi=T.length-1,c=t*100;if(c<T[0])return -1;while(lo<hi){const m=(lo+hi+1)>>1;if(T[m]<=c)lo=m;else hi=m-1}return lo}
function mark(force){
 if(!cur||!spans.length)return;const i=idxAt(audio.currentTime);
 if(i!==on){if(on>=0&&spans[on])spans[on].classList.remove("on");on=i;if(i>=0)spans[i].classList.add("on")}
 if(i>=0&&follow){const sc=$("#main"),r=spans[i].getBoundingClientRect(),h=sc.getBoundingClientRect();const y=r.top-h.top;if(force||y<h.height*.15||y>h.height*.6){sc.scrollTo({top:sc.scrollTop+y-h.height*.3,behavior:force?"auto":"smooth"})}}
 const sk=$("#sk");if(sk&&document.activeElement!==sk){sk.value=audio.currentTime;$("#tc").textContent=fmt(audio.currentTime);$("#tr").textContent="−"+fmt(cur.duration-audio.currentTime)}
}
function loop(){if(!audio.paused){mark();requestAnimationFrame(loop)}}
function save(){if(cur&&HAVE[cur.id]&&audio.currentTime>0)localStorage.setItem("pos:"+cur.id,audio.currentTime.toFixed(1))}
audio.addEventListener("play",()=>{playBtn();requestAnimationFrame(loop);if(navigator.mediaSession)navigator.mediaSession.playbackState="playing"});
audio.addEventListener("pause",()=>{playBtn();save();mark();if(navigator.mediaSession)navigator.mediaSession.playbackState="paused"});
audio.addEventListener("timeupdate",()=>{if(sleepAt&&Date.now()>=sleepAt){sleepAt=0;audio.pause();slpLabel()}else slpLabel();if(++saveTick%16==0)save();if(document.hidden)return;if(audio.paused)mark()});
audio.addEventListener("ended",()=>{if(cur)localStorage.setItem("pos:"+cur.id,"0");sleepEnd=false;slpLabel()});
audio.playbackRate=+(localStorage.getItem("rate")||1);audio.addEventListener("loadedmetadata",()=>{audio.playbackRate=+(localStorage.getItem("rate")||1)});
document.addEventListener("visibilitychange",()=>{save();if(!document.hidden)mark(true)});
function mediaSession(){if(!("mediaSession" in navigator)||!cur)return;const ms=navigator.mediaSession;
 ms.metadata=new MediaMetadata({title:cur.title,artist:"Arthur Conan Doyle",album:cur.book,artwork:[{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});
 const h={play:()=>audio.play(),pause:()=>audio.pause(),seekbackward:()=>audio.currentTime-=15,seekforward:()=>audio.currentTime+=15,seekto:e=>audio.currentTime=e.seekTime};
 for(const k in h)try{ms.setActionHandler(k,h[k])}catch(e){}}
// ---------- boot ----------
document.documentElement.style.setProperty("--fs",(localStorage.getItem("fs")||(innerWidth<600?20:23))+"px");
(async()=>{try{LIB=await (await fetch("data/index.json")).json();await refreshHave()}catch(e){$("#main").innerHTML=`<p style="padding:20px">Couldn't load the library: ${esc(String(e))}</p>`;return}
 const h=location.hash.slice(1);if(h&&LIB.some(s=>s.id===h))openStory(h);else renderLib()})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
